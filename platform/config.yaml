server:
  addr: ":18080"
  env: dev

db:
  primary: "postgres://yuging:secret@localhost:5432/yuging_platform?sslmode=disable"

queue:
  driver: memory

auth:
  jwtSecret: "local-dev-secret"
  accessTTL: "15m"
  refreshTTL: "720h"

engines:
  query:
    url: "http://127.0.0.1:18000"
    timeout: "60s"
  insight:
    url: "http://127.0.0.1:18002"
    timeout: "300s"
  report:
    url: "http://127.0.0.1:18003"
    timeout: "300s"
