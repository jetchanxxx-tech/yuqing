name: PostgreSQL Contract Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-postgresql:
    name: PostgreSQL Store Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: yuqing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run PostgreSQL tests
        working-directory: platform
        env:
          YUQING_TEST_PG_URL: postgres://postgres:testpass@localhost:5432/yuqing_test?sslmode=disable
        run: |
          go test ./internal/business/analysis -v -count=1 -run ".*PG.*|.*Pg.*|.*pg.*"
          go test ./internal/business/report -v -count=1 -run ".*PG.*|.*Pg.*|.*pg.*"
          go test ./internal/business/alert -v -count=1 -run ".*PG.*|.*Pg.*|.*pg.*"

      - name: Verify tests actually ran
        working-directory: platform
        env:
          YUQING_TEST_PG_URL: postgres://postgres:testpass@localhost:5432/yuqing_test?sslmode=disable
        run: |
          OUTPUT=$(go test ./internal/business/analysis -v 2>&1)
          if ! echo "$OUTPUT" | grep -q "pgStore\|pgPool\|PostgreSQL"; then
            echo "ERROR: PostgreSQL tests did not execute"
            echo "Test output:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✓ PostgreSQL tests executed successfully"
