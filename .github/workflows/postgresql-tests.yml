name: PostgreSQL Contract Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: postgresql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-postgresql:
    name: PostgreSQL Store Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Only the disposable service in this GitHub hosted job is permitted.
      YUQING_TEST_PG_URL: postgres://postgres:testpass@127.0.0.1:5432/yuqing_test?sslmode=disable
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: yuqing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: true
          cache-dependency-path: platform/go.sum

      - name: Download locked Go modules
        working-directory: platform
        run: go mod download

      - name: Run and verify PostgreSQL contracts
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          mkdir -p "${GITHUB_WORKSPACE}/test-results"
          event_log="${GITHUB_WORKSPACE}/test-results/postgresql-test-events.jsonl"

          # Run whole existing packages: several PG contracts have a /postgres
          # subtest beneath a name without PG, so a PG-only regex misses them.
          # Add accountadmin/accountclosure only when those packages and their
          # real PG tests exist, and extend verify-go-test-events.py with them.
          set +e
          go test -json -count=1 -race -timeout 10m \
            ./migrations \
            ./cmd/cli \
            ./internal/api/v1 \
            ./internal/app \
            ./internal/platform/auth \
            ./internal/platform/settings \
            ./internal/pkg/email \
            ./internal/pkg/sms \
            ./internal/platform/apikey \
            ./internal/platform/billingpolicy \
            ./internal/platform/usage \
            ./internal/platform/accountadmin \
            ./internal/platform/tenant \
            ./internal/platform/credit \
            ./internal/platform/payment \
            ./internal/business/analysis \
            ./internal/business/report \
            ./internal/business/alert 2>&1 | tee "$event_log"
          test_pipeline_status=("${PIPESTATUS[@]}")
          set -e

          python3 "${GITHUB_WORKSPACE}/scripts/ci/verify-go-test-events.py" \
            "$event_log" --go-exit-code "${test_pipeline_status[0]}"
          test "${test_pipeline_status[1]}" -eq 0

      - name: Preserve complete PostgreSQL test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-contract-events-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/postgresql-test-events.jsonl
          if-no-files-found: error
          retention-days: 7
