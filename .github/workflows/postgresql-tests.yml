name: PostgreSQL Contract Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: postgresql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-postgresql:
    name: PostgreSQL Store Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: yuqing_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache: true
          cache-dependency-path: platform/go.sum

      - name: Run PostgreSQL tests
        working-directory: platform
        env:
          YUQING_TEST_PG_URL: postgres://postgres:testpass@localhost:5432/yuqing_test?sslmode=disable
        run: |
          go test ./migrations -v -count=1 -run TestReportCenterMigration
          go test ./internal/business/analysis -v -count=1 -run ".*PG.*|.*Pg.*|.*pg.*"
          go test ./internal/business/report -v -count=1 -run ".*PG.*|.*Pg.*|.*pg.*"
          go test ./internal/business/alert -v -count=1 -run ".*PG.*|.*Pg.*|.*pg.*"

      - name: Verify tests actually ran
        working-directory: platform
        env:
          YUQING_TEST_PG_URL: postgres://postgres:testpass@localhost:5432/yuqing_test?sslmode=disable
        run: |
          OUTPUT=$(go test ./internal/business/analysis -v -count=1 -run ".*PG.*|.*Pg.*|.*pg.*" 2>&1)
          if ! echo "$OUTPUT" | grep -q "=== RUN   Test.*PG\|=== RUN   Test.*Pg\|=== RUN   Test.*pg"; then
            echo "ERROR: PostgreSQL tests did not execute"
            echo "Test output:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "✓ PostgreSQL tests executed successfully"
