name: Build and Package

on:
  push:
    branches: [dev, prod, main, 'beta/**']
  pull_request:
    branches: [dev, prod, main, 'beta/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - name: Test with race detector
        run: go test ./... -count=1 -race -timeout 10m
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64 binaries
        run: make build GOOS=linux GOARCH=amd64 CGO_ENABLED=0
      - uses: actions/upload-artifact@v4
        with:
          name: platform-binaries-${{ github.sha }}
          path: platform/bin/yuqing-*
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  postgresql:
    name: PostgreSQL contract checks
    uses: ./.github/workflows/postgresql-tests.yml

  package:
    name: Release archive
    needs: [go, frontend, postgresql]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-binaries-${{ github.sha }}
          path: platform/bin
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist
      - name: Package verified source and binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/yuqing-release"
          mkdir -p "$release_dir" release-artifacts
          git archive "$GITHUB_SHA" | tar -x -C "$release_dir"
          mkdir -p "$release_dir/platform/bin" "$release_dir/web/dist"
          cp -a platform/bin/. "$release_dir/platform/bin/"
          cp -a web/dist/. "$release_dir/web/dist/"
          chmod 755 "$release_dir/platform/bin/yuqing-"*
          printf '%s\n' "$GITHUB_SHA" > "$release_dir/BUILD_COMMIT"
          (
            cd "$release_dir"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          archive="yuqing-linux-amd64-${GITHUB_SHA}.tar.gz"
          tar -czf "release-artifacts/$archive" -C "$release_dir" .
          (
            cd release-artifacts
            sha256sum "$archive" > "$archive.sha256"
          )
          printf 'Commit: `%s`\n\nArtifact: `yuqing-release-%s`\n' "$GITHUB_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: yuqing-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
