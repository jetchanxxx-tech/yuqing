name: Build and Package

on:
  push:
    branches: [dev, prod, main, 'beta/**']
  pull_request:
    branches: [dev, prod, main, 'beta/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - name: Test with race detector
        run: go test ./... -count=1 -race -timeout 10m
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64 binaries
        run: make build GOOS=linux GOARCH=amd64 CGO_ENABLED=0
      - uses: actions/upload-artifact@v4
        with:
          name: platform-binaries-${{ github.sha }}
          path: platform/bin/yuqing-*
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python engine billing sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare sandbox dependencies on the hosted runner
        run: |
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          python -m pip install 'fastapi>=0.115.0' 'httpx>=0.27.0' 'pydantic>=2.0' 'python-docx>=1.1.0' 'pytest>=8.0' 'pytest-asyncio>=0.24.0' 'scrapling[fetchers]==0.4.15' 'playwright==1.63.0'
      - name: Exercise actual engine clients with offline provider responses
        run: |
          python -m pytest engines/tests -q --junitxml=test-results/python-engine-billing.xml
          python scripts/ci/verify-python-billing-events.py test-results/python-engine-billing.xml
      - name: Preserve Python sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-engine-billing-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/python-engine-billing.xml
          if-no-files-found: error
          retention-days: 7

  report-quality:
    name: Report download and snapshot audit
    needs: [go]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YUQING_TEST_PG_URL: postgres://postgres:testpass@127.0.0.1:5432/yuqing_report_quality_test?sslmode=disable
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: yuqing_report_quality_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: platform-binaries-${{ github.sha }}
          path: platform/bin
      - name: Prepare hosted report audit dependencies
        run: |
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          chmod 755 platform/bin/yuqing-*
          python -m pip install 'fastapi>=0.115.0' 'httpx>=0.27.0' 'pydantic>=2.0' 'python-docx>=1.1.0' 'uvicorn>=0.34.0' 'psycopg[binary]>=3.2'
      - name: Audit actual report downloads and historical snapshots
        run: python scripts/ci/audit-report-delivery.py
      - name: Preserve report acceptance failures and download bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/report-quality/
          if-no-files-found: error
          retention-days: 30

  billing-bridge:
    name: Actual Python Go PostgreSQL usage bridge
    needs: [go]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YUQING_TEST_PG_URL: postgres://postgres:testpass@127.0.0.1:5432/yuqing_billing_bridge_test?sslmode=disable
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: yuqing_billing_bridge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: platform-binaries-${{ github.sha }}
          path: platform/bin
      - name: Prepare prebuilt binaries and bridge sandbox dependencies
        run: |
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          chmod 755 platform/bin/yuqing-*
          python -m pip install 'httpx>=0.27.0' 'psycopg[binary]>=3.2'
      - name: Verify actual committed ACK loss and restart settlement
        run: python scripts/ci/verify-llm-usage-bridge.py
      - name: Preserve actual bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-billing-bridge-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/billing-bridge/
          if-no-files-found: error
          retention-days: 7

  postgresql:
    name: PostgreSQL contract checks
    uses: ./.github/workflows/postgresql-tests.yml

  account-admin:
    name: Account and administrator acceptance
    needs: [go, frontend, postgresql]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YUQING_TEST_PG_URL: postgres://postgres:testpass@127.0.0.1:5432/yuqing_account_admin_test?sslmode=disable
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:8080
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: yuqing_account_admin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Require GitHub hosted runner
        shell: bash
        run: test "${RUNNER_ENVIRONMENT}" = github-hosted
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: platform-binaries-${{ github.sha }}
          path: platform/bin
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist
      - name: Prepare prebuilt executables
        run: chmod 755 platform/bin/yuqing-*
      - name: Install locked browser test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium on the hosted runner
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify administrator bootstrap on the prebuilt CLI
        run: python3 scripts/ci/verify-admin-bootstrap.py
      - name: Prepare isolated notification provider transport
        run: python3 scripts/ci/prepare-notification-sandbox.py
      - name: Run the isolated account and administrator suite
        working-directory: web
        run: npx playwright test --config e2e/account-admin.config.ts
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-admin-browser-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            web/test-results/account-admin/
            web/e2e/report/account-admin/
          if-no-files-found: warn
          retention-days: 7

  scrapling-runtime:
    name: Scrapling static and Chromium runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned browser on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          mkdir -p test-results/scrapling-runtime
          printf '%s\n' "${GITHUB_SHA}" > test-results/scrapling-runtime/BUILD_COMMIT
          python -m pip install 'scrapling[fetchers]==0.4.15' 'playwright==1.63.0' 'httpx>=0.27.0' 'fastapi>=0.115.0'
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/yuqing-browser-runtime"
          python -m playwright install --with-deps --no-shell chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Exercise actual isolated Scrapling static and dynamic fixture
        run: python scripts/ci/verify-scrapling-runtime.py test-results/scrapling-runtime/result.json
      - name: Package pinned runtime for offline deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-artifacts
          python -c 'import importlib.metadata,json,os;from pathlib import Path;Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"],"RUNTIME.json").write_text(json.dumps({"scrapling":importlib.metadata.version("scrapling"),"playwright":importlib.metadata.version("playwright"),"build_commit":os.environ["GITHUB_SHA"]},indent=2))'
          tar -czf browser-artifacts/scrapling-browser-runtime.tar.gz -C "$PLAYWRIGHT_BROWSERS_PATH" .
          (cd browser-artifacts && sha256sum scrapling-browser-runtime.tar.gz > scrapling-browser-runtime.tar.gz.sha256)
          python -m pip download --only-binary=:all: --no-deps --dest browser-artifacts/wheels 'scrapling[fetchers]==0.4.15' 'playwright==1.63.0'
      - uses: actions/upload-artifact@v4
        with:
          name: scrapling-browser-runtime-${{ github.sha }}
          path: browser-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-runtime-evidence-${{ github.sha }}
          path: test-results/scrapling-runtime/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Release archive
    needs: [go, frontend, postgresql, account-admin, python, billing-bridge, scrapling-runtime, report-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform-binaries-${{ github.sha }}
          path: platform/bin
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: scrapling-browser-runtime-${{ github.sha }}
          path: browser-artifacts
      - name: Package verified source and binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/yuqing-release"
          mkdir -p "$release_dir" release-artifacts
          git archive "$GITHUB_SHA" | tar -x -C "$release_dir"
          mkdir -p "$release_dir/platform/bin" "$release_dir/web/dist" "$release_dir/deployment-wheels"
          # Production already supplies lxml/typing_extensions. Ship the missing
          # pure Python DOCX wheel from the hosted runner; deployment is offline
          # and never compiles dependencies on the server.
          python3 -m pip download --only-binary=:all: --no-deps \
            --dest "$release_dir/deployment-wheels" 'python-docx==1.2.0'
          (cd browser-artifacts && sha256sum -c scrapling-browser-runtime.tar.gz.sha256)
          mkdir -p "$release_dir/browser-runtime"
          tar -xzf browser-artifacts/scrapling-browser-runtime.tar.gz -C "$release_dir/browser-runtime"
          cp browser-artifacts/wheels/*.whl "$release_dir/deployment-wheels/"
          cp -a platform/bin/. "$release_dir/platform/bin/"
          cp -a web/dist/. "$release_dir/web/dist/"
          chmod 755 "$release_dir/platform/bin/yuqing-"*
          printf '%s\n' "$GITHUB_SHA" > "$release_dir/BUILD_COMMIT"
          (
            cd "$release_dir"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          archive="yuqing-linux-amd64-${GITHUB_SHA}.tar.gz"
          tar -czf "release-artifacts/$archive" -C "$release_dir" .
          (
            cd release-artifacts
            sha256sum "$archive" > "$archive.sha256"
          )
          printf 'Commit: `%s`\n\nArtifact: `yuqing-release-%s`\n' "$GITHUB_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: yuqing-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
