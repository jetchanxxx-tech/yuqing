<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- Empty state: search / no results -->
  <rect width="240" height="160" rx="12" fill="#fafafa"/>
  <!-- Magnifier -->
  <g transform="translate(104, 44)">
    <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(48,48,52,0.12)" stroke-width="1.5"/>
    <line x1="35" y1="35" x2="48" y2="48" stroke="rgba(48,48,52,0.10)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Question mark inside -->
    <text x="22" y="28" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" font-weight="400" fill="rgba(48,48,52,0.18)">?</text>
  </g>
  <!-- Accent dot -->
  <circle cx="120" cy="110" r="3" fill="rgba(255,36,66,0.20)"/>
</svg>