# 盘古舆情 — HTTP-only 站点配置（无域名 / 未签发证书时使用）
# 与 nginx.conf 的区别：不含 443/ssl_certificate 指令。
# 缺少证书文件时，nginx.conf 的 ssl_certificate 会让 `nginx -t` 直接失败，
# 导致整个 nginx 无法 reload（实测）。此模板保证纯 IP 访问也能跑起来。
server {
    listen 80;
    server_name _;

    root /opt/yuging/web/dist;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE 支持
        proxy_read_timeout 300s;      # 长任务/流式响应
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
