# 盘古舆情 — HTTP-only 站点配置（无域名 / 未签发证书时使用）
# 与 nginx.conf 的区别：不含 443/ssl_certificate 指令。
# 缺少证书文件时，nginx.conf 的 ssl_certificate 会让 `nginx -t` 直接失败，
# 导致整个 nginx 无法 reload（实测）。此模板保证纯 IP 访问也能跑起来。
server {
    # default_server：IP 直连（无域名）时没有 server_name 可匹配，只有标记
    # default_server 的块能接住请求。Ubuntu 自带的 sites-enabled/default 默认
    # 占着这个位置，会把访问指向 /var/www/html 欢迎页（实测）。
    # deploy.sh 会在部署前停用冲突的默认站点（备份至 /root/）。
    listen 80 default_server;
    server_name _;

    root /opt/yuging/web/dist;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE 支持
        proxy_read_timeout 300s;      # 长任务/流式响应
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
