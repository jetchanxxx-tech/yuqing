# 盘古舆情 — HTTPS 站点配置（acme.sh 签发证书时使用）
#
# 占位符由 deploy.sh 替换：
#   __DOMAIN__     → 域名，如 yuqing.pangu-cloud.com
#   __CERT_DIR__   → 证书目录，如 /etc/nginx/ssl/yuqing.pangu-cloud.com
#
# 证书由 acme.sh 通过 webroot 模式签发，续期钩子自动 reload nginx。
# 关键：HTTP 块必须保留 /.well-known/acme-challenge/ 的 webroot 路径，
# 否则证书续期时 ACME 挑战会被 301 重定向打断，导致续期失败。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    # ACME 续期挑战——必须在 HTTP 上直通，不能被重定向
    location /.well-known/acme-challenge/ {
        root /opt/yuqing/web/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 走 listen 参数：Ubuntu 24.04 自带 nginx 1.24，
    # 独立的 `http2 on;` 指令需 1.25.1+，在 1.24 上是 unknown directive（实测）。
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/yuqing/web/dist;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE 支持
        proxy_read_timeout 300s;      # 长任务/流式响应
    }

    # 静态资源缓存（Vite 产物带内容哈希，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
